name: WakeUpStreamlit
on:
  schedule:
    - cron: '0 */12 * * *'  # Запуск каждые 12 часов (в 00:00 и 12:00 по UTC)
  workflow_dispatch:      # Позволяет запустить проверку вручную кнопкой

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to app
        run: curl -I https://9oc3.streamlit.app
